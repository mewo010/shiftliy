name: Shiftly Multi-Platform Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version tag (e.g. v1.0.1). Leave empty to auto-generate.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # =============================================================
  # 1. ANDROID PLATFORM
  # =============================================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-generate Android Platform
        run: flutter create . --platforms=android

      - name: Enable Core Library Desugaring
        run: |
          if [ -f android/app/build.gradle ]; then
            python3 -c "
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          if 'coreLibraryDesugaringEnabled' not in content:
              if 'compileOptions {' in content:
                  content = content.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
              else:
                  content = content.replace('android {', 'android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }')

          if 'multiDexEnabled' not in content:
              if 'defaultConfig {' in content:
                  content = content.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled true')

          if 'desugar_jdk_libs' not in content:
              if 'dependencies {' in content:
                  content = content.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"')
              else:
                  content += '\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"\n}\n'

          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          print('Updated android/app/build.gradle with desugaring configuration.')
          "
          fi

          if [ -f android/app/build.gradle.kts ]; then
            python3 -c "
          with open('android/app/build.gradle.kts', 'r') as f:
              content = f.read()

          if 'isCoreLibraryDesugaringEnabled' not in content and 'coreLibraryDesugaringEnabled' not in content:
              if 'compileOptions {' in content:
                  content = content.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
              else:
                  content = content.replace('android {', 'android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }')

          if 'multiDexEnabled' not in content:
              if 'defaultConfig {' in content:
                  content = content.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled = true')

          if 'desugar_jdk_libs' not in content:
              if 'dependencies {' in content:
                  content = content.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")')
              else:
                  content += '\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n'

          with open('android/app/build.gradle.kts', 'w') as f:
              f.write(content)
          print('Updated android/app/build.gradle.kts with desugaring configuration.')
          "
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Hive Adapters & Code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        run: flutter build apk --release

      - name: Prepare Android Assets
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/shiftly-android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-android
          path: dist/shiftly-android.apk

  # =============================================================
  # 2. IOS PLATFORM
  # =============================================================
  build-ios:
    name: Build iOS (IPA & App)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-generate iOS Platform
        run: flutter create . --platforms=ios

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Hive Adapters & Code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package iOS Artifacts
        run: |
          mkdir -p dist/Payload
          cp -r build/ios/iphoneos/Runner.app dist/Payload/
          cd dist
          zip -r shiftly-ios.ipa Payload
          cd ..
          zip -r dist/shiftly-ios-app.zip build/ios/iphoneos/Runner.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-ios
          path: |
            dist/shiftly-ios.ipa
            dist/shiftly-ios-app.zip

  # =============================================================
  # 3. WINDOWS PLATFORM
  # =============================================================
  build-windows:
    name: Build Windows (EXE Zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-generate Windows Platform
        run: flutter create . --platforms=windows

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Hive Adapters & Code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows Desktop
        run: flutter build windows --release

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\shiftly-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-windows
          path: dist/shiftly-windows-x64.zip

  # =============================================================
  # 4. MACOS PLATFORM
  # =============================================================
  build-macos:
    name: Build macOS (App Zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-generate macOS Platform
        run: flutter create . --platforms=macos

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Hive Adapters & Code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS Desktop
        run: flutter build macos --release

      - name: Package macOS Artifacts
        run: |
          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -r ../../../../../dist/shiftly-macos.zip *.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-macos
          path: dist/shiftly-macos.zip

  # =============================================================
  # 5. LINUX PLATFORM
  # =============================================================
  build-linux:
    name: Build Linux (GTK Bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-generate Linux Platform
        run: flutter create . --platforms=linux

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Hive Adapters & Code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux Desktop
        run: flutter build linux --release

      - name: Package Linux Artifacts
        run: |
          mkdir -p dist
          tar -czvf dist/shiftly-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-linux
          path: dist/shiftly-linux-x64.tar.gz

  # =============================================================
  # 6. WEB PLATFORM
  # =============================================================
  build-web:
    name: Build Web (HTML/JS Zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-generate Web Platform
        run: flutter create . --platforms=web

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Hive Adapters & Code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web
        run: flutter build web --release

      - name: Package Web Artifacts
        run: |
          mkdir -p dist
          cd build/web
          zip -r ../../dist/shiftly-web.zip .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-web
          path: dist/shiftly-web.zip

  # =============================================================
  # 7. UPLOAD TO GITHUB RELEASES TAB
  # =============================================================
  release:
    name: Publish to GitHub Releases Tab
    needs:
      - build-android
      - build-ios
      - build-windows
      - build-macos
      - build-linux
      - build-web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Display Release Assets
        run: ls -la release_assets/

      - name: Determine Dynamic Release Version
        id: release_tag
        run: |
          # 1. If triggered by git tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            NAME="Shiftly Release $TAG"
          # 2. If specified manually in workflow_dispatch
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            TAG="${{ github.event.inputs.version_name }}"
            NAME="Shiftly Release $TAG"
          # 3. Dynamic increment based on pubspec version + GitHub run number
          else
            MAJOR_MINOR=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'.' -f1,2)
            if [ -z "$MAJOR_MINOR" ]; then
              MAJOR_MINOR="1.0"
            fi
            TAG="v${MAJOR_MINOR}.${{ github.run_number }}"
            NAME="Shiftly Release v${MAJOR_MINOR}.${{ github.run_number }}"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "Computed Release Tag: $TAG"
          echo "Computed Release Title: $NAME"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          files: release_assets/*
          generate_release_notes: true
          body: |
            ### 🚀 Shiftly Multi-Platform Release (${{ steps.release_tag.outputs.tag }})

            Automated multi-platform release containing all platform builds:

            | Platform | File | Description |
            | :--- | :--- | :--- |
            | 🤖 **Android** | `shiftly-android.apk` | Release APK ready to install on Android |
            | 🍏 **iOS** | `shiftly-ios.ipa` & `shiftly-ios-app.zip` | iOS App bundle (Unsigned) |
            | 🪟 **Windows** | `shiftly-windows-x64.zip` | Windows standalone executable package |
            | 🍎 **macOS** | `shiftly-macos.zip` | macOS Application package |
            | 🐧 **Linux** | `shiftly-linux-x64.tar.gz` | Linux GTK x64 bundle |
            | 🌐 **Web** | `shiftly-web.zip` | Production web build |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
