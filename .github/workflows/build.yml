name: Build Shiftly Multi-Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # 1. BUILD ANDROID, LINUX & WEB (Ubuntu Runner)
  # -------------------------------------------------------------
  build-ubuntu:
    name: Build Android, Linux & Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-generate Platforms
        run: flutter create . --platforms=android,linux,web

      - name: Install Dependencies & Run Build Runner
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        run: flutter build apk --release --split-per-abi

      - name: Build Linux Desktop
        run: flutter build linux --release

      - name: Build Web
        run: flutter build web --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-android-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload Linux Bundle
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-linux-app
          path: build/linux/x64/release/bundle/

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-web-bundle
          path: build/web/

  # -------------------------------------------------------------
  # 2. BUILD WINDOWS DESKTOP (Windows Runner)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-generate Windows Platform
        run: flutter create . --platforms=windows

      - name: Install Dependencies & Run Build Runner
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows Desktop
        run: flutter build windows --release

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-windows-app
          path: build/windows/x64/runner/Release/

  # -------------------------------------------------------------
  # 3. BUILD IOS & MACOS (macOS Runner)
  # -------------------------------------------------------------
  build-apple:
    name: Build iOS & macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-generate Apple Platforms
        run: flutter create . --platforms=ios,macos

      - name: Install Dependencies & Run Build Runner
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS Desktop
        run: flutter build macos --release

      - name: Build iOS (No Sign)
        run: flutter build ios --release --no-codesign

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-macos-app
          path: build/macos/Build/Products/Release/

      - name: Upload iOS Runner Payload
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-ios-app
          path: build/ios/iphoneos/Runner.app
